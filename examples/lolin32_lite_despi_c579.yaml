external_components:
  - source: github://joes-cloud/waveshare579_bwr
    components: [waveshare579_bwr]
    refresh: 0s

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23

color:
  - id: epaper_red
    red: 100%
    green: 0%
    blue: 0%

font:
  - file: "gfonts://Roboto"
    id: font_32
    size: 32

display:
  - platform: waveshare579_bwr
    id: epaper_display
    cs_pin: GPIO5
    dc_pin: GPIO17
    reset_pin: GPIO27
    busy_pin:
      number: GPIO19
      mode:
        input: true
        pulldown: true
    full_update_every: 5
    full_refresh_mode: fast
    update_debounce: 500ms
    update_interval: never
    lambda: |-
      it.fill(Color::WHITE);
      it.rectangle(0, 0, 792, 272, Color::BLACK);
      it.print(20, 40, id(font_32), Color::BLACK, "BLACK");
      it.print(20, 95, id(font_32), id(epaper_red), "RED");
      it.filled_rectangle(500, 40, 180, 80, id(epaper_red));
      // update() detects black/white changes and refreshes only their bounding box.
      // A specific region can still be refreshed manually if needed:
      // id(epaper_display).partial_refresh(0, 0, 396, 136);
